plugins { id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT' }
repositories { mavenCentral() }
group = 'dev.war'
version = '21.17.3-26.3-port-dev'
base { archivesName = 'openfight' }
tasks.named('jar') { from 'LICENSE' }
loom { accessWidenerPath = file('src/main/resources/epicfight.accesswidener') }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000', '-Xmaxwarns', '30', '-proc:none']
}
sourceSets.main.resources.srcDir('src/generated/resources')
// TASK.md explicitly omits optional integrations and datagen. Combat, skills and rendering remain in main.
sourceSets.main.java {
    exclude 'dev/war/openfight/compat/*/**'
    exclude 'dev/war/openfight/platform/neoforge/**'
    exclude 'dev/war/openfight/data/DataEvents.java', 'dev/war/openfight/data/recipes/**', 'dev/war/openfight/data/tags/**'
}
// Explicit progress check; the full main source tree remains compiled by build.
tasks.register('verifyPortAdapters', JavaCompile) {
    source = fileTree('src/main/java') {
        include 'dev/war/openfight/platform/fabric/**/*.java'
        exclude 'dev/war/openfight/platform/fabric/item/ItemMaterial.java'
        exclude 'dev/war/openfight/platform/fabric/event/FabricGameplayEvents.java'
        include 'dev/war/openfight/platform/ModPlatform.java'
        include 'dev/war/openfight/platform/client/*.java'
    }
    classpath = sourceSets.main.compileClasspath
    options.sourcepath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/portAdapters')
}
tasks.register('compilePortVerification', JavaCompile) {
    dependsOn 'verifyPortAdapters', 'verifyPortMath'
    source = fileTree('src/portTest/java') { include '**/*.java' }
    classpath = sourceSets.main.compileClasspath + files(layout.buildDirectory.dir('classes/portAdapters'), layout.buildDirectory.dir('classes/portMath'))
    destinationDirectory = layout.buildDirectory.dir('classes/portVerification')
}
tasks.register('verifyPortMath', JavaCompile) {
    source = fileTree('src/main/java') {
        include 'dev/war/openfight/api/utils/math/*.java'
        include 'dev/war/openfight/api/animation/Joint.java', 'dev/war/openfight/api/animation/JointTransform.java'
        include 'dev/war/openfight/EpicFight.java', 'dev/war/openfight/platform/ModPlatform.java', 'dev/war/openfight/platform/ModPlatformProvider.java'
    }
    classpath = sourceSets.main.compileClasspath
    options.sourcepath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/portMath')
}
tasks.register('verifyPortTransforms', JavaExec) {
    dependsOn 'compilePortVerification'
    mainClass = 'dev.war.openfight.port.TransformVerification'
    classpath = sourceSets.main.compileClasspath + files(layout.buildDirectory.dir('classes/portMath'), layout.buildDirectory.dir('classes/portVerification'))
}
tasks.register('verifyPortPackMetadata', JavaExec) {
    dependsOn 'compilePortVerification', 'processResources'
    mainClass = 'dev.war.openfight.port.PackMetadataVerification'
    classpath = sourceSets.main.compileClasspath + files(layout.buildDirectory.dir('classes/portVerification'))
    args layout.buildDirectory.dir('resources/main').get().asFile.absolutePath
}
tasks.register('verifyPortEntityNbt', JavaExec) {
    dependsOn 'compilePortVerification'
    mainClass = 'dev.war.openfight.port.EntityNbtVerification'
    classpath = sourceSets.main.compileClasspath + files(layout.buildDirectory.dir('classes/portAdapters'), layout.buildDirectory.dir('classes/portVerification'))
}
tasks.register('verifyPortConfig', JavaExec) {
    dependsOn 'compilePortVerification'
    mainClass = 'dev.war.openfight.port.ConfigVerification'
    classpath = sourceSets.main.compileClasspath + files(layout.buildDirectory.dir('classes/portAdapters'), layout.buildDirectory.dir('classes/portVerification'))
    args layout.buildDirectory.dir('port-verification/config').get().asFile.absolutePath
}
tasks.processResources {
    exclude 'META-INF/**', 'epicfight-compat.*.mixins.json', 'epicfight-platform.neoforge.mixins.json'
    exclude 'kubejs.plugins.txt', 'shouldersurfing_plugin.json'
    exclude 'assets/minecraft/animated_layers/player/waveycapes.json'
    exclude 'data/**/recipes/**', 'data/**/loot_tables/**', 'data/**/advancements/**'
    exclude 'data/**/tags/items/**', 'data/**/tags/blocks/**', 'data/**/tags/entity_types/**', 'data/**/tags/damage_types/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doLast {
        def destination = destinationDir.toPath().resolve('assets').toFile()
        def upstreamAssets = file('upstream/src/main/resources/assets')
        if (!upstreamAssets.isDirectory()) {
            throw new GradleException("Missing upstream assets submodule at ${upstreamAssets}")
        }
        project.copy {
            from upstreamAssets
            into destination
            exclude 'epicfight/nativelib/**', 'epicskins/**', 'minecraft/animated_layers/player/waveycapes.json'
        }

        // Fabric cannot load NeoForge's separate_transforms item model loader. Split
        // each upstream model into the four vanilla perspective models at build time.
        def itemModels = new File(upstreamAssets, 'epicfight/models/item')
        def generatedItemModels = new File(destination, 'epicfight/models/item/fabric_port')
        generatedItemModels.mkdirs()
        itemModels.listFiles()?.findAll { it.isFile() && it.name.endsWith('.json') }?.each { sourceModel ->
            def model = new groovy.json.JsonSlurper().parse(sourceModel)
            if (model.loader != 'neoforge:separate_transforms') return
            def stem = sourceModel.name.substring(0, sourceModel.name.length() - '.json'.length())
            def variants = ['base': model.base] + (model.perspectives ?: [:])
            variants.each { perspective, contents ->
                def output = new File(generatedItemModels, "${stem}_${perspective}.json")
                def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(contents))
                // Match the two-space formatting used by the previous generated files.
                output.text = json.replaceAll('(?m)^( +)') { match, indent -> ' ' * (indent.length() / 2) }.replace('\n', '\r\n') + '\r\n'
            }
        }

        def textures = new File(destination, 'epicfight/textures')
        [
            'models/armor/stray_cloth_layer_1.png': 'entity/equipment/humanoid/stray_cloth.png',
            'models/armor/stray_cloth_layer_2.png': 'entity/equipment/humanoid_leggings/stray_cloth.png'
        ].each { source, target ->
            def sourceFile = new File(textures, source)
            def targetFile = new File(textures, target)
            if (!sourceFile.isFile()) throw new GradleException("Missing source texture ${sourceFile}")
            targetFile.parentFile.mkdirs()
            java.nio.file.Files.copy(sourceFile.toPath(), targetFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }

        def overlayAssets = file('overlay/assets')
        if (overlayAssets.isDirectory()) {
            project.copy {
                from overlayAssets
                into destination
                exclude '**/lang/*.json'
            }
            fileTree(overlayAssets).matching { include '**/lang/*.json' }.files.each { overlayFile ->
                def relative = overlayAssets.toPath().relativize(overlayFile.toPath()).toString()
                def mergedFile = new File(destination, relative)
                def merged = mergedFile.isFile() ? new groovy.json.JsonSlurper().parse(mergedFile) : [:]
                merged.putAll(new groovy.json.JsonSlurper().parse(overlayFile))
                mergedFile.parentFile.mkdirs()
                mergedFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)) + '\n'
            }
        }
    }
}
apply from: 'port-access.gradle'
tasks.register('verifyNoArrAssets') {
    group = 'verification'
    description = 'Rejects checked-in assets and files duplicated from the upstream ARR asset tree.'
    doLast {
        def sourceAssets = file('src/main/resources/assets')
        if (sourceAssets.exists() && fileTree(sourceAssets).files) {
            throw new GradleException('src/main/resources/assets must remain empty; use overlay/assets for port additions.')
        }

        def overlayModels = file('overlay/assets/epicfight/models')
        if (overlayModels.exists() && fileTree(overlayModels).files) {
            throw new GradleException('Upstream-derived models must be generated into build resources; overlay/assets/epicfight/models must remain empty.')
        }

        def git = new ProcessBuilder('git', 'ls-files', '-z').directory(projectDir).start()
        def tracked = git.inputStream.bytes
        def gitError = git.errorStream.text
        if (git.waitFor() != 0) {
            throw new GradleException("git ls-files failed: ${gitError}")
        }
        def upstreamAssets = file('upstream/src/main/resources/assets')
        def upstreamHashes = [] as Set
        if (upstreamAssets.isDirectory()) {
            fileTree(upstreamAssets).files.each { upstreamFile ->
                upstreamHashes.add(java.security.MessageDigest.getInstance('SHA-256').digest(upstreamFile.bytes).encodeHex().toString())
            }
        }
        new String(tracked, 'UTF-8').split('\\u0000').findAll { it }.each { path ->
            def trackedFile = file(path)
            if (!trackedFile.isFile()) return
            if (path ==~ /(?i).*\\.(dll|so|dylib)$/) {
                throw new GradleException("Native library must not be tracked: ${path}")
            }
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(trackedFile.bytes).encodeHex().toString()
            if (upstreamHashes.contains(hash)) {
                throw new GradleException("Tracked file duplicates an upstream ARR asset: ${path}")
            }
        }
    }
}

tasks.named('check') { dependsOn 'verifyPortConfig', 'verifyPortTransforms', 'verifyPortPackMetadata', 'verifyPortEntityNbt', 'auditMixinTargets', 'verifyNoArrAssets' }

// Explicit development-only title-screen smoke run, with runtime mixin audit and screenshot.
if (providers.gradleProperty('portSmoke').isPresent()) {
    loom.runs.client { vmArg '-Dopenfight.portSmoke=true'; vmArg '-Dmixin.debug.verbose=true' }
}
